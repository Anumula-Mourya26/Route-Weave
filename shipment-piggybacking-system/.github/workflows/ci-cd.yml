name: Intelligent Shipment Piggybacking CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Gateway & Tests (Node.js 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Execute Jest & Supertest Integration Tests
        working-directory: backend
        run: npm test

  python-engine-ci:
    name: Python Solver & Optimization Tests (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: python-engine/requirements.txt

      - name: Install Python Dependencies
        working-directory: python-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite for OR-Tools CVRPTW Solver
        working-directory: python-engine
        run: pytest tests/test_optimizer.py -v

  production-deploy:
    name: Production Deployment to AWS (ECS & S3/CloudFront)
    runs-on: ubuntu-latest
    needs: [backend-ci, python-engine-ci]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      ECR_BACKEND_REPO: shipment-piggybacking/node-backend
      ECR_PYTHON_REPO: shipment-piggybacking/python-engine
      ECS_CLUSTER: shipment-piggybacking-cluster
      ECS_NODE_SERVICE: shipment-piggybacking-node-service
      ECS_PYTHON_SERVICE: shipment-piggybacking-python-service
      S3_BUCKET: shipment-piggybacking-frontend-static-production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ShipmentPiggybacking-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Node.js Backend Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_BACKEND_REPO:latest ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:latest

      - name: Build, Tag, and Push Python Engine Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_PYTHON_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_PYTHON_REPO:latest ./python-engine
          docker push $ECR_REGISTRY/$ECR_PYTHON_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_PYTHON_REPO:latest

      - name: Update Amazon ECS Services
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_NODE_SERVICE }} --force-new-deployment
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service ${{ env.ECS_PYTHON_SERVICE }} --force-new-deployment

      - name: Setup Node.js 18 for Frontend Build
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build Production Bundle
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Deploy Frontend to Amazon S3
        run: |
          aws s3 sync frontend/dist/ s3://${{ secrets.S3_FRONTEND_BUCKET || env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront Distribution Cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
          fi
